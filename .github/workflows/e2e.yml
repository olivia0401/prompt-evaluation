name: Browser suite

# Install the browser engines once, with bounded setup and test times.
#
# The suite starts its own API on a fresh SQLite database (new checkout) with
# DISABLE_RUN_EXECUTION=1, so it never contacts an LLM provider and needs no
# provider keys. The persona keys are test fixtures committed in e2e/personas.ts;
# a staging target supplies its own through E2E_PRINCIPALS as a secret.

on:
  push:
  pull_request:

concurrency:
  group: browser-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Browser suite (smoke + full)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install service dependencies
        run: pip install -r requirements-service.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install browser engines
        working-directory: e2e
        timeout-minutes: 10
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Smoke tier
        working-directory: e2e
        timeout-minutes: 5
        run: npx playwright test --grep @smoke

      - name: Full suite
        working-directory: e2e
        timeout-minutes: 10
        run: npx playwright test

      # Uploaded only on failure: a trace for a green run is noise, and a trace
      # for a red one is the difference between "CI is flaky" and a diagnosis.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
