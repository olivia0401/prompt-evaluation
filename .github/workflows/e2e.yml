name: Browser suite

# Tiered, so the cheap tier gates every push and the expensive tier does not.
#
#   tier 1  smoke     3 engines, seconds        every push
#   tier 2  full      3 engines, 6 personas,    every push (it is only ~10s)
#           + isolation
#
# The suite starts its own API on a throwaway SQLite database with
# DISABLE_RUN_EXECUTION=1, so it never contacts an LLM provider and needs no
# provider keys. The persona keys are test fixtures committed in e2e/personas.ts;
# a staging target supplies its own through E2E_PRINCIPALS as a secret.

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Smoke (3 browsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install service dependencies
        run: pip install -r requirements-service.txt

      - name: Install browser engines
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Smoke tier
        working-directory: e2e
        run: npx playwright test --grep @smoke

  full:
    name: Personas + isolation (3 browsers)
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install service dependencies
        run: pip install -r requirements-service.txt

      - name: Install browser engines
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Full suite
        working-directory: e2e
        run: npx playwright test

      # Uploaded only on failure: a trace for a green run is noise, and a trace
      # for a red one is the difference between "CI is flaky" and a diagnosis.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
