name: Eval gate

# Release gate: fail if eval quality regressed vs service/eval_baseline.json.
#
# Scoring needs real API calls + the confidential briefs.yml, so this does NOT
# score in CI. outputs/ is gitignored and no baseline is committed yet, so on
# this public repo both steps currently SKIP (green) on every pull request:
#   - no scored.csv / quality report present -> the step prints a notice;
#   - no service/eval_baseline.json -> ci_gate prints current scores, exits 0.
# To make it a real gate, run it where scored.csv exists (a release pipeline
# with the briefs) and commit a baseline from `ci_gate --update-baseline`.

on:
  workflow_dispatch:
    inputs:
      scored_path:
        description: Path to scored.csv to gate on
        default: outputs/scored.csv
        required: false
      quality_report_path:
        description: Path to quality-report/v1 JSON to gate on
        default: outputs/quality_report.json
        required: false
  pull_request:

jobs:
  gate:
    name: Eval regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-service.txt

      # `set -euo pipefail`, and tests/test_workflows.py runs `bash -n` over
      # every run block: a gate whose own shell is broken is worse than no
      # gate, because it fails for a reason that has nothing to do with quality.
      - name: Run eval gate
        shell: bash
        run: |
          set -euo pipefail
          SCORED="${{ github.event.inputs.scored_path || 'outputs/scored.csv' }}"
          if [ -f "$SCORED" ]; then
            python -m service.ci_gate --scored "$SCORED"
          else
            echo "No $SCORED present — skipping gate. Produce it with:"
            echo "  python -m scripts.analyze --score"
            echo "then re-run this workflow (or run it in your release pipeline)."
          fi

      - name: Run evidence-grounded quality gate
        shell: bash
        run: |
          set -euo pipefail
          REPORT="${{ github.event.inputs.quality_report_path || 'outputs/quality_report.json' }}"
          if [ -f "$REPORT" ]; then
            python -m service.quality_gate "$REPORT"
          else
            echo "No $REPORT present — skipping evidence-grounded gate."
            echo "Produce a quality-report/v1 JSON after the annotated evaluation run."
          fi
